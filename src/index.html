<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Expense Tracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Track your daily expenses, set a monthly budget and see where your money goes.">
  <meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Apply the saved theme before first paint (avoids a flash of the wrong theme)
    try {
      var s = JSON.parse(localStorage.getItem('expense-tracker-settings') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
